<!--
  =============================================
  File:    routines.html
  Purpose: Routines page - allows users to view,
           create and delete their workout routines
  Author:  Kavinghty
  Updated: May 2026
  =============================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Routines – Fitness Companion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>

<!-- Main navigation bar -->
<nav class="nav">
  <a href="/" class="nav-logo">Fitness Companion</a>
  <div class="nav-links">
    <a href="/" class="nav-link">Today</a>
    <a href="/routines" class="nav-link active">Routines</a>
    <a href="/stats" class="nav-link">Stats</a>
  </div>
</nav>

<div class="page">

  <!-- Page heading and new routine button -->
  <div class="top-bar">
    <div class="page-header" style="margin-bottom:0;">
      <p class="label">Your plans</p>
      <h1>Routines</h1>
    </div>
    <button class="btn-primary" id="new-btn" onclick="openForm()">+ New</button>
  </div>

  <!-- New routine form - hidden by default, opens when button is clicked -->
  <div class="form-sheet" id="form-sheet">
    <div class="form-sheet-top">
      <span class="form-title">New routine</span>
      <button class="close-btn" onclick="closeForm()">✕</button>
    </div>

    <!-- Routine name input -->
    <div class="field-group">
      <label class="field-label">Name</label>
      <input type="text" id="input-name" class="field" placeholder="e.g. Push Day, Leg Day..." />
    </div>

    <!-- Optional description input -->
    <div class="field-group">
      <label class="field-label">Description</label>
      <input type="text" id="input-desc" class="field" placeholder="Optional..." />
    </div>

    <!-- Form action buttons -->
    <div class="form-actions">
      <button class="btn-ghost" onclick="closeForm()">Cancel</button>
      <button class="btn-primary" onclick="createRoutine()">Create</button>
    </div>

    <!-- Error message shown if name is not filled in -->
    <p class="error-msg" id="error-msg"></p>
  </div>

  <!-- Routine list - rows are added here by JavaScript -->
  <div class="card" style="padding: 0 20px;">
    <div id="routine-list"></div>
  </div>

</div>

<!-- Routine data passed from Flask into JavaScript -->
<script type="application/json" id="routine-data">{{ routines | tojson | safe }}</script>
<script>

  var routines = JSON.parse(document.getElementById("routine-data").textContent);

  /* ---- Display routines ---- */
  function showRoutines() {

    var list = document.getElementById("routine-list");
    list.innerHTML = "";

    if (routines.length === 0) {
      list.innerHTML = '<div class="empty"><p>No routines yet. Create your first one!</p></div>';
      return;
    }

    // loop through and make a row for each routine
    for (var i = 0; i < routines.length; i++) {

      var r = routines[i];

      var row = document.createElement("div");
      row.className = "workout-row";

      var descHtml = "";
      if (r.DESCRIPTION) {
        descHtml = '<div class="workout-meta">' + safe(r.DESCRIPTION) + '</div>';
      }

      row.innerHTML =
        '<div class="workout-left">' +
          '<div>' +
            '<div class="workout-name">' +
              '<a href="/routines/' + r.ROUTINE_ID + '" class="link-name">' + safe(r.ROUTINE_NAME) + '</a>' +
            '</div>' +
            descHtml +
          '</div>' +
        '</div>' +
        '<button class="delete-btn" onclick="deleteRoutine(' + r.ROUTINE_ID + ')">✕</button>';

      list.appendChild(row);
    }

  }

  /* ---- Open and close the form ---- */
  function openForm() {
    document.getElementById("form-sheet").classList.add("open");
    document.getElementById("new-btn").style.display = "none";
    document.getElementById("error-msg").textContent = "";
  }

  function closeForm() {
    document.getElementById("form-sheet").classList.remove("open");
    document.getElementById("new-btn").style.display = "inline-flex";
    // clear the inputs
    document.getElementById("input-name").value = "";
    document.getElementById("input-desc").value = "";
  }

  /* ---- Save a new routine to the database ---- */
  function createRoutine() {

    var name = document.getElementById("input-name").value.trim();
    var desc = document.getElementById("input-desc").value.trim();

    if (name === "") {
      document.getElementById("error-msg").textContent = "Please enter a name.";
      return;
    }

    fetch("/create_routine", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ name: name, description: desc })
    })
    .then(function (res) {
      return res.json();
    })
    .then(function (data) {
      if (data.error) {
        document.getElementById("error-msg").textContent = data.error;
        return;
      }
      routines.push(data);
      showRoutines();
      closeForm();
    });

  }

  /* ---- Delete a routine from the database ---- */
  function deleteRoutine(id) {

    if (!confirm("Delete this routine?")) return;

    fetch("/delete_routine/" + id, { method: "DELETE" })
    .then(function (res) {
      return res.json();
    })
    .then(function (data) {
      if (data.ok) {
        // filter out the deleted one
        routines = routines.filter(function (r) {
          return r.ROUTINE_ID !== id;
        });
        showRoutines();
      }
    });

  }

  /* ---- Stops special characters breaking the page ---- */
  function safe(str) {
    if (!str) return "";
    var result = String(str);
    result = result.replace(/&/g, "&amp;");
    result = result.replace(/</g, "&lt;");
    result = result.replace(/>/g, "&gt;");
    result = result.replace(/"/g, "&quot;");
    return result;
  }

  // run on load
  showRoutines();

</script>
</body>
</html>
