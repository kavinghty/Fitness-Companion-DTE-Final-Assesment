<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Routines | Fitness Companion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body>

<nav class="nav">
  <a href="/" class="nav-logo">Fitness Companion</a>
  <div class="nav-links">
    <a href="/" class="nav-link">Today</a>
    <a href="/routines" class="nav-link active">Routines</a>
    <a href="/stats" class="nav-link">Stats</a>
  </div>
</nav>

<div class="page">
  <div class="top-bar">
    <div class="page-header">
      <p class="label">Your plans</p>
      <h1 style="margin-top: 5px;">Routines</h1>
    </div>
    <button class="btn-primary" id="new-btn" onclick="open_me()">+ New</button>
  </div>

  <div class="form-sheet" id="pop-up">
    <div class="form-sheet-top">
      <span class="form-title">New routine</span>
      <button class="close-btn" onclick="close_me()">✕</button>
    </div>
    <div class="field-group">
      <label class="field-label">Name</label>
      <input type="text" id="rn" class="field" placeholder="Leg Day, etc">
    </div>
    <div class="field-group">
      <label class="field-label">Description</label>
      <input type="text" id="rd" class="field" placeholder="Optional notes">
    </div>
    <div class="form-actions">
      <button class="btn-ghost" onclick="close_me()">Cancel</button>
      <button class="btn-primary" onclick="save()">Create</button>
    </div>
    <span id="msg" style="color:red; font-size:11px;"></span>
  </div>

  <div class="card" style="padding: 0 20px;">
    <div id="routines-here"></div>
  </div>
</div>

<script id="d" type="application/json">{{ routines | tojson | safe }}</script>

<script>
// global data from flask
var data = JSON.parse(document.getElementById('d').innerHTML);

function show() {
  var list = document.getElementById('routines-here');
  list.innerHTML = "";

  if(data.length == 0) {
    list.innerHTML = '<div class="empty"><p>No routines yet.</p></div>';
    return;
  }

  // just loop through it
  for (var i = 0; i < data.length; i++) {
    var r = data[i];
    var div = document.createElement('div');
    div.className = 'workout-row';
    
    var info = r.DESCRIPTION ? '<div class="workout-meta">' + h(r.DESCRIPTION) + '</div>' : '';

    div.innerHTML = '<div class="workout-left"><div>' +
      '<div class="workout-name"><a href="/routines/' + r.ROUTINE_ID + '" class="link-name">' + h(r.ROUTINE_NAME) + '</a></div>' +
      info + '</div></div>' +
      '<button class="delete-btn" onclick="drop(' + r.ROUTINE_ID + ')">✕</button>';
    
    list.appendChild(div);
  }
}

function open_me() {
  document.getElementById('pop-up').classList.add('open');
  document.getElementById('new-btn').style.display = 'none';
}

function close_me() {
  document.getElementById('pop-up').classList.remove('open');
  document.getElementById('new-btn').style.display = 'inline-flex';
  document.getElementById('rn').value = '';
  document.getElementById('rd').value = '';
}

function save() {
  var n = document.getElementById('rn').value;
  var d = document.getElementById('rd').value;

  if(!n.trim()) {
    document.getElementById('msg').innerText = "Needs a name";
    return;
  }

  fetch('/create_routine', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({name: n, description: d})
  }).then(function(r) { return r.json() }).then(function(res) {
    if(res.error) {
      document.getElementById('msg').innerText = res.error;
    } else {
      data.push(res);
      show();
      close_me();
    }
  });
}

function drop(id) {
  if(!confirm("Delete this?")) return;
  fetch('/delete_routine/' + id, {method: 'DELETE'})
  .then(function(r) { return r.json() }).then(function(res) {
    if(res.ok) {
      data = data.filter(function(x) { return x.ROUTINE_ID != id });
      show();
    }
  });
}

// simple html escaper
function h(s) {
  var el = document.createElement('div');
  el.innerText = s;
  return el.innerHTML;
}

show();
</script>

</body>
</html>
