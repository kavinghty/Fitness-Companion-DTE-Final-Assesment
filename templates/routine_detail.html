<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ routine.ROUTINE_NAME }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
<div class="page">

  <!-- Top: back link + add exercise button -->
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <a href="/routines" class="back-link">← Routines</a>
      <h1>{{ routine.ROUTINE_NAME }}</h1>
      {% if routine.DESCRIPTION %}
      <p style="color:#888888; font-size:14px;">{{ routine.DESCRIPTION }}</p>
      {% endif %}
    </div>
    <button class="log-btn" id="add-btn" onclick="openForm()" style="padding-top:28px;">+ Add exercise</button>
  </div>

  <hr class="line" style="margin-top:16px;" />

  <!-- Exercise list -->
  <div id="exercise-list"></div>

  <!-- Add exercise form -->
  <div class="modal-card" id="form-card" style="display:none; margin-top:16px;">
    <div class="modal-top">
      <span class="modal-heading">Add exercise</span>
      <button class="close-btn" onclick="closeForm()">✕</button>
    </div>

    <label class="field-label">Exercise</label>
    <select id="input-exercise" class="field">
      <option value="" disabled selected>Select exercise</option>
      {% for e in all_exercises %}
      <option value="{{ e.Exercise_ID }}">{{ e.Name }}</option>
      {% endfor %}
    </select>

    <div class="row-fields">
      <div style="flex:1;">
        <label class="field-label">Sets</label>
        <input type="number" id="input-sets" class="field" value="3" min="1" />
      </div>
      <div style="flex:1;">
        <label class="field-label">Reps</label>
        <input type="number" id="input-reps" class="field" value="10" min="1" />
      </div>
      <div style="flex:1;">
        <label class="field-label">Weight (kg)</label>
        <input type="number" id="input-weight" class="field" value="0" min="0" step="0.5" />
      </div>
      <div style="flex:1;">
        <label class="field-label">Rest (sec)</label>
        <input type="number" id="input-rest" class="field" value="60" min="0" />
      </div>
    </div>

    <div style="display:flex; justify-content:flex-end;">
      <button class="add-btn" onclick="addExercise()">Add</button>
    </div>

    <p class="error-msg" id="error-msg"></p>
  </div>

</div>

<!-- Pass data from Flask to JavaScript -->
<script type="application/json" id="exercise-data">{{ exercises | tojson | safe }}</script>
<script type="application/json" id="routine-meta">{{ {"id": routine.ROUTINE_ID} | tojson | safe }}</script>
<script>
  var ROUTINE_ID = JSON.parse(document.getElementById("routine-meta").textContent).id;
  var exercises  = JSON.parse(document.getElementById("exercise-data").textContent);

  function showExercises() {
    var list = document.getElementById("exercise-list");
    list.innerHTML = "";

    if (exercises.length === 0) {
      list.innerHTML = '<p class="empty">No exercises yet. Add your first one!</p>';
      return;
    }

    exercises.forEach(function (ex, index) {
      var row = document.createElement("div");
      row.className = "exercise-row";
      row.innerHTML =
        '<div>' +
          '<div class="workout-name">' + (index + 1) + '. ' + safe(ex.exercise_name) + '</div>' +
          '<div class="ex-tags">' +
            '<span class="tag">' + ex.Routine_Sets + ' sets</span>' +
            '<span class="tag">' + ex.Routine_Reps + ' reps</span>' +
            '<span class="tag">Rest ' + ex.Rest_Time + 's</span>' +
          '</div>' +
        '</div>' +
        '<button class="delete-btn" onclick="removeExercise(' + ex.Routine_Exercise_ID + ')">🗑</button>';
      list.appendChild(row);
    });
  }

  function openForm() {
    document.getElementById("form-card").style.display = "block";
    document.getElementById("add-btn").style.display   = "none";
    document.getElementById("error-msg").textContent   = "";
  }

  function closeForm() {
    document.getElementById("form-card").style.display = "none";
    document.getElementById("add-btn").style.display   = "block";
    document.getElementById("input-exercise").value    = "";
  }

  function addExercise() {
    var exerciseId = document.getElementById("input-exercise").value;
    var sets       = parseInt(document.getElementById("input-sets").value)    || 3;
    var reps       = parseInt(document.getElementById("input-reps").value)    || 10;
    var rest       = parseInt(document.getElementById("input-rest").value)    || 60;

    if (!exerciseId) {
      document.getElementById("error-msg").textContent = "Please select an exercise.";
      return;
    }

    fetch("/add_exercise_to_routine", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        routine_id:  ROUTINE_ID,
        exercise_id: parseInt(exerciseId),
        sets:        sets,
        reps:        reps,
        rest_time:   rest,
        order:       exercises.length + 1
      })
    })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.error) { document.getElementById("error-msg").textContent = data.error; return; }
      exercises.push(data);
      showExercises();
      closeForm();
    });
  }

  function removeExercise(id) {
    if (!confirm("Remove this exercise?")) return;
    fetch("/remove_exercise/" + id, { method: "DELETE" })
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data.ok) {
        exercises = exercises.filter(function (ex) { return ex.Routine_Exercise_ID !== id; });
        showExercises();
      }
    });
  }

  function safe(str) {
    if (!str) return "";
    return String(str).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
  }

  showExercises();
</script>
</body>
</html>
