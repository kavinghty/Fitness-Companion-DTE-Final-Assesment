<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Fitness Companion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
<body style="background-color: #f4f4f4;"> <div id="TopNavigation">
  <a href="/" class="logo">Fitness Companion</a>
  <ul style="display: inline; list-style-type: none;">
    <li style="display: inline; margin-right: 10px;"><a href="/">Today</a></li>
    <li style="display: inline; margin-right: 10px;"><a href="/routines">Routines</a></li>
    <li style="display: inline;"><a href="/stats">Stats</a></li>
  </ul>
</div>

<div class="container">

  <div class="header-area">
    <p id="DisplayDate"></p>
    <h1 style="margin-top: 5px;">Today</h1>
  </div>

  <button class="blue-btn" id="OpenFormBtn" onclick="openForm()">
    + Log workout
  </button>

  <div class="StatsSection">
    <div class="Box1">
      <span class="BigNumber" id="stat-workouts">0</span>
      <p>workouts today</p>
    </div>
    <div class="Box2">
      <span class="BigNumber" id="stat-minutes">0</span>
      <p>minutes</p>
    </div>
  </div>

  <br>

  <div id="WorkoutPopup" class="form_style" style="display:none;">
    <div class="top-row">
      <h2 style="display:inline;">Log a workout</h2>
      <button type="button" onclick="closeForm()">X</button>
    </div>

    <div class="input-block">
      <label>Choose Routine:</label>
      <select id="routine_select">
        <option value="">-- Please Select --</option>
        {% for r in routines %}
        <option value="{{ r.ROUTINE_ID }}">{{ r.ROUTINE_NAME }}</option>
        {% endfor %}
      </select>
    </div>

    <div class="input-block">
      <label>Date of workout:</label>
      <input type="date" id="date_input">
    </div>

    <div class="input-block">
      <label>Time:</label>
      <input type="time" id="time_input">
    </div>

    <div class="buttons">
      <button type="button" onclick="closeForm()">Nevermind</button>
      <button type="button" class="save-btn" onclick="addWorkout()">Save Workout</button>
    </div>

    <p id="error_text" style="color:red;"></p>
  </div>
  <h3 class="title2">Workout log</h3>
  <div class="list-container">
    <div id="workout-list">
      </div>
  </div>

</div>

<script id="workout-data" type="application/json">{{ workouts | tojson | safe }}</script>

<script src="{{ url_for('static', filename='script.js') }}"></script>

</body>
</html>
