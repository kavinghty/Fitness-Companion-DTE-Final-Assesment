<!--
  =============================================
  File:    index.html
  Purpose: Main homepage - shows todays workouts
           and allows the user to log a new one
  Author:  Kavinghty
  Updated: May 2026
  =============================================
-->

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Fitness Companion</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>

<!-- Main navigation bar -->
<nav class="nav">
  <a href="/" class="nav-logo">Fitness Companion</a>
  <div class="nav-links">
    <a href="/" class="nav-link active">Today</a>
    <a href="/routines" class="nav-link">Routines</a>
    <a href="/stats" class="nav-link">Stats</a>
  </div>
</nav>

<div class="page">

  <!-- Page heading - date gets filled in by script.js -->
  <div class="page-header">
    <p class="label" id="date-label"></p>
    <h1>Today</h1>
  </div>

  <!-- Stats strip - shows workouts today and minutes -->
  <div class="stats-strip">
    <div class="stat-card">
      <div class="num dark" id="stat-workouts">0</div>
      <div class="lbl">workouts today</div>
    </div>
    <div class="stat-card">
      <div class="num" id="stat-minutes">0</div>
      <div class="lbl">minutes</div>
    </div>
  </div>

  <!-- Button to open the log workout form -->
  <button class="btn-primary" id="log-btn" onclick="openForm()" style="margin-bottom:20px;">
    + Log workout
  </button>

  <!-- Log workout form - hidden by default, opens when button is clicked -->
  <div class="form-sheet" id="form-sheet">
    <div class="form-sheet-top">
      <span class="form-title">Log a workout</span>
      <button class="close-btn" onclick="closeForm()">✕</button>
    </div>

    <!-- Routine dropdown - populated from the database by Flask -->
    <div class="field-group">
      <label class="field-label">Routine</label>
      <select id="input-routine" class="field">
        <option value="" disabled selected>Pick a routine...</option>
        {% for r in routines %}
        <option value="{{ r.ROUTINE_ID }}">{{ r.ROUTINE_NAME }}</option>
        {% endfor %}
      </select>
    </div>

    <!-- Date and time fields sit side by side -->
    <div class="fields-row">
      <div class="field-group">
        <label class="field-label">Date</label>
        <input type="date" id="input-date" class="field" />
      </div>
      <div class="field-group">
        <label class="field-label">Time</label>
        <input type="time" id="input-time" class="field" />
      </div>
    </div>

    <!-- Form action buttons -->
    <div class="form-actions">
      <button class="btn-ghost" onclick="closeForm()">Cancel</button>
      <button class="btn-primary" onclick="addWorkout()">Save</button>
    </div>

    <!-- Error message shown if fields are not filled in correctly -->
    <p class="error-msg" id="error-msg"></p>
  </div>

  <!-- Workout list - rows are added here by script.js -->
  <p class="section-heading">Workout log</p>
  <div class="card" style="padding: 0 20px;">
    <div id="workout-list"></div>
  </div>

</div>

<!-- Workout data passed from Flask into JavaScript -->
<script type="application/json" id="workout-data">{{ workouts | tojson | safe }}</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
