<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Tracker</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}" />
</head>
<body>
<div class="page">

  <!-- Top: date + routines link -->
  <div style="display:flex; justify-content:space-between; align-items:flex-start;">
    <div>
      <p class="date-label" id="date-label"></p>
      <h1>Today</h1>
    </div>
    <a href="/routines" class="routines-link">Routines →</a>
  </div>

  <!-- Stats -->
  <div class="stats">
    <div>
      <div class="big-num" id="stat-minutes">0</div>
      <div class="small-label">minutes</div>
    </div>
    <div>
      <div class="big-num" id="stat-workouts">0</div>
      <div class="small-label">workouts</div>
    </div>
  </div>

  <!-- Workout list -->
  <hr class="line" />
  <div id="workout-list"></div>

  <!-- Button to open the form -->
  <button class="log-btn" id="log-btn" onclick="openModal()">+ Log workout</button>

  <!-- Log workout form -->
  <div class="modal-card" id="modal-card" style="display:none;">
    <div class="modal-top">
      <span class="modal-heading">Log workout</span>
      <button class="close-btn" onclick="closeModal()">✕</button>
    </div>

    <select id="input-routine" class="field">
      <option value="" disabled selected>Select routine</option>
      {% for r in routines %}
      <option value="{{ r.ROUTINE_ID }}">{{ r.ROUTINE_NAME }}</option>
      {% endfor %}
    </select>

    <div class="row-fields">
      <input type="date" id="input-date" class="field" style="flex:1;" />
      <input type="time" id="input-time" class="field" style="flex:1;" />
    </div>

    <div style="display:flex; justify-content:flex-end;">
      <button class="add-btn" onclick="addWorkout()">Add</button>
    </div>

    <p class="error-msg" id="error-msg"></p>
  </div>

</div>

<!-- Pass workout data from Flask to JavaScript -->
<script type="application/json" id="workout-data">{{ workouts | tojson | safe }}</script>
<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
